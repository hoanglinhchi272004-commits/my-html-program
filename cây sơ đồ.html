<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>CÂY SƠ ĐỒ ĐA LINK</title>
    <style>
        :root {
            --bg: #1e1e2e;
            --panel: #181825;
            --event-color: #89b4fa;
            --text: #cdd6f4;
            --danger: #f38ba6;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .toolbar { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        button { padding: 6px 12px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; background: #313244; color: white; font-size: 12px; }
        button:hover:not(:disabled) { background: #45475a; }
        button:disabled { background: #21222c; color: #585b70; cursor: not-allowed; }
        #editor-canvas { background: var(--panel); padding: 20px; border-radius: 8px; min-height: 400px; }
        
        .node { margin: 6px 0; border-left: 3px solid transparent; position: relative; }
        .level-0 { border-left-color: #f38ba6; } 
        .level-1 { border-left-color: #a6e3a1; } 
        .level-2 { border-left-color: #fab387; } 
        .level-3 { border-left-color: #f9e2af; } 

        .node-content { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 4px; background: #313244; flex-wrap: wrap; }
        .node-content.selected { outline: 2px solid var(--event-color); }

        .drag-handle { color: #cdd6f4; padding: 4px 6px; cursor: grab; font-weight: bold; user-select: none; }
        .collapse-btn { background: #45475a; color: var(--text); padding: 2px 6px; width: 24px; text-align: center; border-radius: 3px; cursor: pointer; }
        
        .node-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; border-left: 1px solid #45475a; padding-left: 8px; }
        .crosslink-container { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; max-width: 350px; }
        .crosslink-chip { background: #45475a; padding: 2px 8px; border-radius: 10px; font-size: 11px; display: flex; align-items: center; gap: 4px; color: var(--event-color); border: 1px solid #585b70; }
        .crosslink-chip button { background: transparent; padding: 0 2px; color: var(--danger); font-size: 10px; }
        
        /* --- CSS Drag & Drop Preview --- */
        .drop-before { box-shadow: 0 -3px 0 0 var(--event-color) !important; z-index: 10; }
        .drop-after { box-shadow: 0 3px 0 0 var(--event-color) !important; z-index: 10; }
        .drop-inside { outline: 2px solid var(--event-color) !important; background: rgba(137, 180, 250, 0.2) !important; }
        .drop-invalid { outline: 2px dashed var(--danger) !important; background: rgba(243, 139, 166, 0.2) !important; box-shadow: none !important; }

        #root-drop-zone {
            margin-top: 20px;
            padding: 15px;
            border: 2px dashed #45475a;
            border-radius: 8px;
            text-align: center;
            color: #585b70;
            font-weight: bold;
            transition: all 0.2s;
        }
        #root-drop-zone.drag-over {
            border-color: var(--event-color);
            background: rgba(137, 180, 250, 0.1);
            color: var(--event-color);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #21222c;
            border: 1px solid #45475a;
            border-radius: 8px;
            padding: 16px;
            width: 480px;
            max-width: 90%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .modal-content input {
            width: 100%;
            background: #181825;
            border: 1px solid #45475a;
            border-radius: 4px;
            color: var(--text);
            padding: 8px 10px;
            font-size: 13px;
            box-sizing: border-box;
            flex: 0 0 auto;
        }
        .modal-table-container {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #45475a;
            border-radius: 4px;
            background: #181825;
        }
        .modal-table {
            width: 100%;
            border-collapse: collapse;
        }
        .modal-table th, .modal-table td {
            padding: 8px 12px;
            text-align: left;
            font-size: 12px;
            border-bottom: 1px solid #313244;
        }
        .modal-table th {
            background: #313244;
            color: var(--event-color);
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .modal-table tr:hover {
            background: #313244;
            color: var(--event-color);
            cursor: pointer;
        }

        .children { margin-left: 30px; padding-left: 10px; border-left: 1px dashed #45475a; }
        
        input { background: transparent; border: none; color: white; outline: none; padding: 4px; font-size: 13px; min-width: 20px; }

        .node-text-input {
            background: transparent;
            border: none;
            color: white;
            outline: none;
            padding: 4px;
            font-size: 13px;
            min-width: 20px;
            resize: none;
            overflow: hidden;
            font-family: inherit;
            line-height: 1.4;
            white-space: pre;
            overflow-wrap: normal;
            word-break: normal;
            box-sizing: border-box;
        }
    </style>
</head>
<body onclick="handleBodyClick(event)">

    <h2>CÂY SƠ ĐỒ ĐA LINK</h2>
    <div class="toolbar">
        <button onclick="addRootNode()">➕ Thêm Node</button>
        <button id="btn-undo" onclick="undo()" disabled>↶ Undo</button>
        <button id="btn-redo" onclick="redo()" disabled>↷ Redo</button>
        <div style="width: 1px; background: #45475a; margin: 0 5px;"></div>
        <button onclick="exportData()" style="background: #a6e3a1; color: #1e1e2e;">⬇️ Xuất Markdown</button>
        <button onclick="document.getElementById('import-input').click()" style="background: #89b4fa; color: #1e1e2e;">⬆️ Nhập Markdown</button>
        <input type="file" id="import-input" style="display:none" accept=".md,.txt" onchange="importData(event)">
    </div>

    <div id="editor-canvas" ondragover="event.preventDefault()"></div>
    <div id="modal-root"></div>

    <script>
        let data = JSON.parse(localStorage.getItem('gdev_data')) || [{ id: 1, text: 'Main Loop', children: [], collapsed: false, crosslinks: [] }];
        let undoStack = []; let redoStack = []; let draggedId = null; let selectedId = null;
        let activeModalNodeId = null;

        function save(isNewAction = true) {
            if (isNewAction) { undoStack.push(JSON.stringify(data)); redoStack = []; }
            localStorage.setItem('gdev_data', JSON.stringify(data));
            render(); updateToolbarState();
        }

        // --- Export/Import Logic ---
        function exportData() {
            const markdownContent = `# Cây Sơ Đồ Đa Link Backup\n\n\`\`\`json\n${JSON.stringify(data, null, 2)}\n\`\`\``;
            const blob = new Blob([markdownContent], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `cay_so_do_${new Date().toISOString().slice(0, 10)}.md`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const content = e.target.result;
                const match = content.match(/```json\n([\s\S]*?)\n```/);
                if (match && match[1]) {
                    try {
                        const importedData = JSON.parse(match[1]);
                        data = importedData;
                        save(true);
                        alert("Đã nhập dữ liệu thành công!");
                    } catch (err) {
                        alert("Định dạng dữ liệu không hợp lệ.");
                    }
                } else {
                    alert("Không tìm thấy dữ liệu JSON trong file Markdown.");
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function toggleCrosslink(nodeId, targetId) {
            targetId = parseInt(targetId);
            if (!targetId) return;
            updateData((nodes) => {
                toggleCrosslinkRecursive(nodes, nodeId, targetId);
            });
            save(true);
        }

        function toggleCrosslinkRecursive(nodes, nodeId, targetId) {
            for (let n of nodes) {
                if (n.id === nodeId) {
                    if (!n.crosslinks) n.crosslinks = [];
                    if (n.crosslinks.includes(targetId)) {
                        n.crosslinks = n.crosslinks.filter(id => id !== targetId);
                    } else {
                        n.crosslinks.push(targetId);
                    }
                    return true;
                }
                if (toggleCrosslinkRecursive(n.children, nodeId, targetId)) return true;
            }
            return false;
        }

        function removeCrosslink(nodeId, targetId) {
            updateData((nodes) => {
                const findAndRemove = (list) => {
                    for (let n of list) {
                        if (n.id === nodeId) { n.crosslinks = n.crosslinks.filter(id => id !== targetId); return true; }
                        if (findAndRemove(n.children)) return true;
                    }
                };
                findAndRemove(nodes);
            });
            save(true);
        }

        function updateData(callback) { callback(data); }

        function autoResizeInput(inputElement) {
            const lines = inputElement.value.split('\n');
            const longestLine = lines.reduce((max, line) => Math.max(max, line.length), 0);
            inputElement.style.width = Math.max(longestLine, 2) + 2 + 'ch';
            inputElement.style.height = 'auto';
            inputElement.style.height = Math.max(inputElement.scrollHeight, 26) + 'px';
        }

        function handleTextKeydown(e, id) {
            if (e.key === 'Enter') {
                e.stopPropagation();
                return;
            }
            e.stopPropagation();
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function renderNodes(nodes, container, depth) {
            nodes.forEach(node => {
                if (!node.crosslinks) node.crosslinks = [];
                if (node.crosslinkTo) { node.crosslinks = [node.crosslinkTo]; delete node.crosslinkTo; }

                const div = document.createElement('div');
                div.className = `node level-${depth % 4}`;
                
                const initialWidth = Math.max((node.text || '').length, 2) + 2;

                div.innerHTML = `
                    <div class="node-content ${selectedId === node.id ? 'selected' : ''}" 
                         id="node-content-${node.id}"
                         onclick="selectNode(event, ${node.id})"
                         ondragover="dragOverNode(event, ${node.id})" 
                         ondragleave="dragLeaveNode(event, ${node.id})"
                         ondrop="dropNodeEvent(event, ${node.id})">
                        <span class="drag-handle" draggable="true" ondragstart="dragStart(event, ${node.id})" ondragend="clearDropPreview()">⠿ </span>
                        ${node.children.length ? `<button class="collapse-btn" onclick="toggleCollapse(${node.id})">${node.collapsed ? '▶' : '▼'}</button>` : `<span style="width: 24px"></span>`}
                        <textarea class="node-text-input" rows="1" data-node-id="${node.id}" style="width: ${initialWidth}ch;" onclick="event.stopPropagation()" onmousedown="event.stopPropagation()" onkeydown="handleTextKeydown(event, ${node.id})" oninput="autoResizeInput(this); updateText(${node.id}, this.value)" onblur="commitTextEdit(${node.id})">${escapeHtml(node.text || '')}</textarea>
                        
                        <div class="node-actions">
                            <div class="crosslink-container">
                                ${node.crosslinks.map(linkId => {
                                    const targetNode = findNodeById(data, linkId);
                                    return `<span class="crosslink-chip">🔗 ${targetNode ? (targetNode.text || 'Untitled') : 'Deleted'}<button onclick="removeCrosslink(${node.id}, ${linkId})">✕</button></span>`;
                                }).join('')}
                                
                                <button style="background: #313244; border: 1px dashed #585b70; color: var(--event-color); padding: 2px 6px;" onclick="openCrosslinkModal(event, ${node.id})">🔗 Chỉ mục</button>
                            </div>
                            <button onclick="addChildNode(${node.id})">➕</button>
                            <button style="background: #f38ba6; color: #1e1e2e;" onclick="removeNode(${node.id})">✕</button>
                        </div>
                    </div>
                    <div class="children" style="display: ${node.collapsed ? 'none' : 'block'};" id="children-${node.id}"></div>
                `;
                container.appendChild(div);
                const textEditor = div.querySelector('.node-text-input');
                if (textEditor) autoResizeInput(textEditor);
                renderNodes(node.children, document.getElementById('children-' + node.id), depth + 1);
            });
        }

        function renderModal() {
            const modalRoot = document.getElementById('modal-root');
            if (activeModalNodeId === null) {
                modalRoot.innerHTML = '';
                return;
            }

            const node = findNodeById(data, activeModalNodeId);
            if (!node) {
                activeModalNodeId = null;
                modalRoot.innerHTML = '';
                return;
            }

            modalRoot.innerHTML = `
                <div class="modal-overlay" onclick="closeModal()">
                    <div class="modal-content" onclick="event.stopPropagation()">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div style="font-size: 14px; font-weight: bold; color: var(--event-color);">Phân Tầng Chỉ Mục File / Node</div>
                            <button style="background: transparent; color: var(--danger); font-size: 14px; padding: 2px 6px;" onclick="closeModal()">✕</button>
                        </div>
                        <input type="text" placeholder="Tìm kiếm theo tên phân tầng..." oninput="filterModalTable(event, ${node.id})" id="modal-search-input" autofocus>
                        <div class="modal-table-container">
                            <table class="modal-table">
                                <thead>
                                    <tr>
                                        <th>Cấu Trúc Phân Tầng & Tên Node</th>
                                    </tr>
                                </thead>
                                <tbody id="modal-table-body">
                                    ${renderModalTableRows(node, '')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
            setTimeout(() => {
                const input = document.getElementById('modal-search-input');
                if (input) input.focus();
            }, 50);
        }

        function getAllNodesHierarchical(nodes, excludeId, depth = 0, list = []) {
            for (let n of nodes) {
                if (n.id !== excludeId) {
                    list.push({ node: n, depth: depth });
                    if (n.children && n.children.length > 0) {
                        getAllNodesHierarchical(n.children, excludeId, depth + 1, list);
                    }
                }
            }
            return list;
        }

        function renderModalTableRows(node, keyword) {
            const hierarchicalNodes = getAllNodesHierarchical(data, node.id).filter(item => !node.crosslinks.includes(item.node.id));
            const filtered = hierarchicalNodes.filter(item => (item.node.text || '').toLowerCase().includes(keyword.toLowerCase()));
            
            if (filtered.length === 0) {
                return `<tr><td style="text-align: center; color: #585b70; padding: 16px;">Không tìm thấy phân tầng phù hợp</td></tr>`;
            }
            return filtered.map(item => {
                const prefix = item.depth > 0 ? '<span style="color:#585b70; margin-right:4px;">└─</span>' : '';
                return `
                    <tr onclick="selectModalItem(${node.id}, ${item.node.id})">
                        <td>
                            <div style="padding-left: ${item.depth * 20}px; display: flex; align-items: center; gap: 4px;">
                                ${prefix}📄 <span style="font-weight: ${item.depth === 0 ? '600' : '400'};">${item.node.text || 'Node không tên'}</span>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function filterModalTable(e, nodeId) {
            const keyword = e.target.value;
            const node = findNodeById(data, nodeId);
            const tbody = document.getElementById('modal-table-body');
            if (node && tbody) {
                tbody.innerHTML = renderModalTableRows(node, keyword);
            }
        }

        function selectModalItem(nodeId, targetId) {
            toggleCrosslink(nodeId, targetId);
            activeModalNodeId = null;
            render();
        }

        function openCrosslinkModal(e, id) {
            e.stopPropagation();
            activeModalNodeId = id;
            render();
        }

        function closeModal() {
            activeModalNodeId = null;
            render();
        }

        function removeNode(id) {
            data = deleteNode(data, id);
            cleanupCrosslinks(data, id);
            save(true);
        }

        function cleanupCrosslinks(nodes, targetId) {
            nodes.forEach(n => {
                if (n.crosslinks) n.crosslinks = n.crosslinks.filter(id => id !== targetId);
                cleanupCrosslinks(n.children, targetId);
            });
        }

        function findNodeById(nodes, id) {
            for (let n of nodes) {
                if (n.id === id) return n;
                const found = findNodeById(n.children, id);
                if (found) return found;
            }
            return null;
        }

        function selectNode(e, id) {
            e.stopPropagation();
            selectedId = id;

            if (e.target.classList && e.target.classList.contains('node-text-input')) {
                e.target.focus();
                const end = e.target.value.length;
                e.target.setSelectionRange(end, end);
            } else {
                render();
            }
        }
        function handleBodyClick(e) { 
            if (!e.target.closest('.node-content')) { 
                selectedId = null; 
                render();
            } 
        }

        function addRootNode() { data.push({ id: Date.now(), text: '', children: [], collapsed: false, crosslinks: [] }); save(true); }
        function addChildNode(parentId) {
            const newNode = { id: Date.now(), text: '', children: [], collapsed: false, crosslinks: [] };
            function push(nodes) {
                for(let n of nodes) {
                    if(n.id === parentId) { n.children.push(newNode); return true; }
                    if(push(n.children)) return true;
                }
            }
            push(data); save(true);
        }
        function updateText(id, val) {
            function update(nodes) {
                for (let n of nodes) {
                    if (n.id === id) { n.text = val; return true; }
                    if (update(n.children)) return true;
                }
                return false;
            }
            update(data);
            localStorage.setItem('gdev_data', JSON.stringify(data));
            updateToolbarState();
        }
        function commitTextEdit(id) {
            undoStack.push(JSON.stringify(data));
            redoStack = [];
            localStorage.setItem('gdev_data', JSON.stringify(data));
            updateToolbarState();
        }

        function toggleCollapse(id) { 
            function toggle(nodes) {
                for(let n of nodes) { if(n.id === id) { n.collapsed = !n.collapsed; return; } toggle(n.children); }
            }
            toggle(data); save(false); 
        }
        
        function deleteNode(nodes, id) { return nodes.filter(n => n.id !== id).map(n => ({ ...n, children: deleteNode(n.children, id) })); }
        
        function updateToolbarState() { document.getElementById('btn-undo').disabled = undoStack.length === 0; document.getElementById('btn-redo').disabled = redoStack.length === 0; }
        function undo() { redoStack.push(JSON.stringify(data)); data = JSON.parse(undoStack.pop()); save(false); }
        function redo() { undoStack.push(JSON.stringify(data)); data = JSON.parse(redoStack.pop()); save(false); }
        
        function render() { 
            const scrollPos = window.scrollY; 
            const canvas = document.getElementById('editor-canvas'); 
            canvas.innerHTML = ''; 
            renderNodes(data, canvas, 0); 
            
            // Appending Root Drop Zone
            const rootDropZone = document.createElement('div');
            rootDropZone.id = 'root-drop-zone';
            rootDropZone.innerHTML = 'Kéo thả vào đây để chuyển thành Root Node ⬇️';
            rootDropZone.ondragover = dragOverRoot;
            rootDropZone.ondragleave = dragLeaveRoot;
            rootDropZone.ondrop = dropToRootZone;
            canvas.appendChild(rootDropZone);

            renderModal();
            window.scrollTo(0, scrollPos); 
        }
        
        // --- DRAG & DROP LOGIC MỚI ---
        let currentDropPos = null;
        let currentDropState = { id: null, pos: null, valid: true };

        function dragStart(e, id) { 
            draggedId = id; 
            e.stopPropagation(); 
            e.dataTransfer.effectAllowed = "move";
        }

        function isDescendant(parentId, childId, nodes = data) {
            if (parentId === childId) return true;
            const parent = findNodeById(nodes, parentId);
            if (!parent) return false;
            return !!findNodeById(parent.children, childId);
        }

        function getDropPosition(e, element) {
            const rect = element.getBoundingClientRect();
            const y = e.clientY - rect.top;
            if (y < rect.height * 0.3) return 'before';
            if (y > rect.height * 0.7) return 'after';
            return 'inside';
        }

        function clearDropPreview() {
            document.querySelectorAll('.drop-before, .drop-after, .drop-inside, .drop-invalid').forEach(el => {
                el.classList.remove('drop-before', 'drop-after', 'drop-inside', 'drop-invalid');
            });
            const rootZone = document.getElementById('root-drop-zone');
            if(rootZone) rootZone.classList.remove('drag-over');
            currentDropState = { id: null, pos: null, valid: true };
        }

        function dragOverNode(e, targetId) {
            e.preventDefault();
            e.stopPropagation();
            if (!draggedId) return;

            const element = document.getElementById(`node-content-${targetId}`);
            if (!element) return;

            const pos = getDropPosition(e, element);
            const valid = !isDescendant(draggedId, targetId);

            if (currentDropState.id === targetId && currentDropState.pos === pos && currentDropState.valid === valid) return;

            clearDropPreview();
            currentDropPos = pos;
            currentDropState = { id: targetId, pos: pos, valid: valid };

            if (!valid) {
                element.classList.add('drop-invalid');
            } else {
                element.classList.add(`drop-${pos}`);
            }
        }

        function dragLeaveNode(e, targetId) {
            const element = document.getElementById(`node-content-${targetId}`);
            if (element) element.classList.remove('drop-before', 'drop-after', 'drop-inside', 'drop-invalid');
        }

        function dragOverRoot(e) {
            e.preventDefault();
            clearDropPreview();
            const rootZone = document.getElementById('root-drop-zone');
            if (rootZone) rootZone.classList.add('drag-over');
        }

        function dragLeaveRoot(e) {
            const rootZone = document.getElementById('root-drop-zone');
            if (rootZone) rootZone.classList.remove('drag-over');
        }

        function extractNode(nodes, id) {
            let extracted = null;
            const newNodes = nodes.filter(n => {
                if (n.id === id) { extracted = n; return false; }
                return true;
            }).map(n => {
                const res = extractNode(n.children, id);
                if (res.extracted) extracted = res.extracted;
                return { ...n, children: res.newNodes };
            });
            return { extracted, newNodes };
        }

        function insertNode(nodes, targetId, position, nodeToInsert) {
            let newNodes = [];
            for (let i = 0; i < nodes.length; i++) {
                const n = nodes[i];
                if (n.id === targetId) {
                    if (position === 'before') newNodes.push(nodeToInsert, n);
                    else if (position === 'after') newNodes.push(n, nodeToInsert);
                    else newNodes.push({ ...n, children: [...n.children, nodeToInsert] });
                } else {
                    newNodes.push({ ...n, children: insertNode(n.children, targetId, position, nodeToInsert) });
                }
            }
            return newNodes;
        }

        function dropNodeEvent(e, targetId) {
            e.preventDefault();
            e.stopPropagation();
            clearDropPreview();

            if (!draggedId || isDescendant(draggedId, targetId)) {
                draggedId = null;
                return;
            }

            const extraction = extractNode(data, draggedId);
            const nodeToMove = extraction.extracted;
            if (!nodeToMove) return;

            data = insertNode(extraction.newNodes, targetId, currentDropPos, nodeToMove);
            
            draggedId = null;
            save(true);
        }

        function dropToRootZone(e) {
            e.preventDefault();
            clearDropPreview();
            
            if (!draggedId) return;
            
            const extraction = extractNode(data, draggedId);
            const nodeToMove = extraction.extracted;
            if (!nodeToMove) return;

            data = extraction.newNodes;
            data.push(nodeToMove);
            
            draggedId = null;
            save(true);
        }
        
        document.addEventListener('dragend', clearDropPreview);

        render();
    </script>
</body>
</html>
